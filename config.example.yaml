# Forge Desk example configuration.
#
# Copy this file to config.yaml (the default location), or point to another
# file with `--config <path>` or the FD_CONFIG environment variable. Without a
# config file, the app falls back to env-only mode (FD_PROVIDER, FD_REPOS, ...).
#
# Environment overrides that apply on top of this file:
#   FD_HOST, FD_PORT (1-65535), FD_CACHE_TTL (seconds, >= 0),
#   FD_REFRESH_MINUTES (0-1440), FD_BASIC_AUTH (user:password), FD_WEBHOOK_SECRET

server:
  host: 0.0.0.0 # default: 0.0.0.0
  port: 8080 # default: 8080
  # Optional login (login page in browsers, HTTP basic auth for scripts). A
  # password is required, from one of:
  #   passwordEnv: name of the env var holding it (recommended; wins when set)
  #   password:    inline value (discouraged)
  # FD_BASIC_AUTH=user:password overrides this whole block.
  basicAuth:
    username: admin
    passwordEnv: FD_BASIC_AUTH_PASSWORD
    # password: change-me

cache:
  ttlSeconds: 300 # default: 300. 0 disables caching.

ui:
  refreshMinutes: 5 # default: 5. Poll the open view using the shared cache; 0 = only the Refresh button.

# Optional webhooks: GitHub/Gitea/Forgejo issue events invalidate the cached views of the repository
# (POST /api/webhooks/github and /api/webhooks/gitea). Disabled without a secret. One of:
#   secretEnv: name of the env var holding the secret (recommended; wins when set)
#   secret:    inline value (discouraged)
# FD_WEBHOOK_SECRET overrides this block. A secretEnv naming an unset variable only warns.
# The cache TTL above still applies as a safety net. See docs/DEPLOYMENT.md#webhooks.
# webhooks:
#   secretEnv: FD_WEBHOOK_SECRET
#   # secret: change-me

# Sources: where issues come from. ids are unique and match ^[a-z0-9][a-z0-9-_]*$
sources:
  # GitHub.com
  - id: gh
    kind: github
    baseUrl: https://api.github.com # default for github
    # webUrl: https://github.com # optional; derived from baseUrl when omitted
    tokenEnv: GITHUB_TOKEN # name of the env var holding the token (recommended)
    # token: ghp_xxx # inline token (discouraged). tokenEnv wins when its variable is set.
    # A missing token variable is not an error: access is anonymous (public repos only).

  # GitHub Enterprise Server (uncomment and adapt)
  # - id: ghes
  #   kind: github
  #   baseUrl: https://ghe.example.com/api/v3 # webUrl becomes https://ghe.example.com
  #   tokenEnv: GHES_TOKEN

  # Gitea (Forgejo should work too, but is untested)
  - id: gt
    kind: gitea
    baseUrl: https://gitea.example.com # required. Instance root; the API is at <baseUrl>/api/v1
    # webUrl: https://gitea.example.com # optional; defaults to baseUrl
    tokenEnv: GITEA_TOKEN

  # Fixture: reads issues from a local JSON file (demos and tests)
  - id: demo
    kind: fixture
    path: ./test/fixtures/demo.json # required; relative to this file's directory

# Views: a set of repositories of one source, planned together.
views:
  - id: platform # unique; ^[a-z0-9][a-z0-9-_]*$
    title: Platform roadmap # default: the id
    source: gh # must be one of the source ids above
    repos: # at least one owner/repo; lowercased, deduplicated, sorted
      - acme/api
      - acme/web
    dependencies:
      native: true # use the provider's native issue relations. default: true
      body: true # true: keyword lines, sections and relation lines; "strict": only "Blocked by: [...]" / "Parent: [...]"; false: none. default: true
      subIssues: false # treat sub-issues as dependencies (github only). default: false
      keywords: # matched at the start of a body line, case-insensitive
        # Each list is optional; a missing list uses its default shown here.
        blockedBy: [depends on, blocked by, requires, dependencies]
        blocks: [blocks, blocking, required by]
    scope:
      labels: [] # when non-empty, only issues with at least one of these labels are in scope
      excludeLabels: [] # issues with any of these labels are out of scope
      milestones: [] # when non-empty, only issues in one of these milestones are in scope
    ordering:
      priorityLabels: [] # highest priority first, e.g. [P0, P1, P2]
      mode: priority # priority (default): order by priority and critical path; waves: order wave by wave

  - id: self-hosted
    source: gt
    repos:
      - team/app

  - id: demo
    title: Demo data
    source: demo
    repos:
      - demo/app

# Release publication is opt-in and off by default. It needs the application login above, the
# image's git/ssh/flock runtime, a private state volume and dedicated credentials; see
