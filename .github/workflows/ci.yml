name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs validate feature branches; main still gets its own post-merge validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Scope heading browser layout regression
        run: node scripts/check-scope-heading-layout.mjs
      - name: Project navigation browser regression
        run: node scripts/check-navigation-browser.mjs
        env:
          BROWSER_EVIDENCE_DIR: navigation-browser-evidence
      - name: Personal preferences browser regression
        run: node scripts/check-preferences-browser.mjs
        env:
          BROWSER_EVIDENCE_DIR: preferences-browser-evidence
      - name: Preserve preferences browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preferences-browser-evidence
          path: preferences-browser-evidence
          if-no-files-found: ignore
      - name: Preserve navigation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-browser-evidence
          path: navigation-browser-evidence
          if-no-files-found: ignore

      - name: Scope refresh browser regression
        run: node scripts/check-refresh-browser.mjs
        env:
          BROWSER_EVIDENCE_DIR: refresh-browser-evidence
      - name: Preserve refresh browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-browser-evidence
          path: refresh-browser-evidence
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release deployment must not silently select a planning-only image, which lacks the
      # git/ssh/flock runtime and refuses to start with releases enabled.
      - name: Release Compose requires an explicit release-capable image
        run: |
          if docker compose -f docker-compose.release.yml config >/dev/null 2>&1; then
            echo '::error::docker-compose.release.yml rendered without FD_IMAGE; it must refuse a default image'
            exit 1
          fi
          FD_IMAGE=ghcr.io/brunoorsolon/forge-desk:test docker compose -f docker-compose.release.yml config >/dev/null
      - run: bash scripts/smoke-test.sh

  forge-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - gitea/gitea:1.25
          - gitea/gitea:1.26.1
          - codeberg.org/forgejo/forgejo:11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/forge-integration.sh ${{ matrix.image }}
