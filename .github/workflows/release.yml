# Publishes the Docker image to GHCR and creates the GitHub Release for a version.
#
# Ways to release version X.Y.Z (package.json must already say X.Y.Z):
# - push a tag: git tag vX.Y.Z && git push origin vX.Y.Z
# - Actions → Release → Run workflow, with "version" set to X.Y.Z: the workflow
#   creates the tag vX.Y.Z on the commit it ran on;
# - publish a release in the GitHub UI: this creates the tag, and the tag push starts
#   the workflow (no separate release trigger, which would run everything twice).
# Each one verifies the code, publishes the image and makes sure the GitHub
# Release exists (notes from .github/release-notes/vX.Y.Z.md if present, plus
# GitHub's generated notes).
#
# Run workflow with an empty "version" is a dry run: verify and build the
# multi-arch image without pushing or releasing anything.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 (must match package.json). Empty = dry run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Decide what to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          case "$EVENT" in
            push) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch) tag="${INPUT_VERSION:+v${INPUT_VERSION#v}}" ;;
          esac
          if [[ -z "$tag" ]]; then
            echo "Dry run: nothing will be pushed or released."
            { echo "release=false"; echo "tag="; echo "latest=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a vX.Y.Z version"
            exit 1
          fi
          if [[ "$tag" != "v$pkg" ]]; then
            echo "::error::$tag does not match package.json version $pkg (expected v$pkg)"
            exit 1
          fi
          # Prereleases (vX.Y.Z-rc.1) never move the latest tag.
          latest=true
          [[ "$tag" == *-* ]] && latest=false
          echo "Releasing $tag (latest=$latest)"
          { echo "release=true"; echo "tag=$tag"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Docker smoke test
        run: bash scripts/smoke-test.sh

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: needs.verify.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.tag }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=raw,value=dry-run,enable=${{ needs.verify.outputs.release != 'true' }}
          flavor: |
            latest=${{ needs.verify.outputs.latest }}
          labels: |
            org.opencontainers.image.title=Forge Desk
            org.opencontainers.image.description=Deterministic dependency graph and execution order for open GitHub/Gitea issues
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [verify, publish-image]
    # A release published in the UI already exists; the step below then does nothing.
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          notes="$(mktemp)"
          if [[ -f ".github/release-notes/$TAG.md" ]]; then
            cat ".github/release-notes/$TAG.md" > "$notes"
          fi
          {
            echo
            echo "## Docker image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:${TAG#v}"
            echo '```'
          } >> "$notes"
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            target=(--verify-tag)
          else
            # Manual run: create the tag on the commit this run built.
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${target[@]}" "${prerelease[@]}" --title "$TAG" \
            --notes-file "$notes" --generate-notes
